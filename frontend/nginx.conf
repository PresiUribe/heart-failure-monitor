# cloudflared llega desde la red interna de Docker: se toma la IP real del
# visitante desde CF-Connecting-IP para que el límite sea por cliente y no global.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # R17: WebSocket (canal principal; los Quick Tunnels no soportan SSE).
    location /api/events/ws {
        proxy_pass http://api:8000/events/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/events/stream {
        # Las cabeceras de seguridad las pone Nginx; se ocultan las de la API para no duplicarlas.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://api:8000/events/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        # Las cabeceras de seguridad las pone Nginx; se ocultan las de la API para no duplicarlas.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Deterministic public ingress for the R21 POST. FastAPI forwards the
    # resource to HAPI and reacts to the same event immediately. HAPI also
    # keeps its standards-based REST-hook Subscription configured.
    location = /fhir/Observation {
        # Las cabeceras de seguridad las pone Nginx; se ocultan las de la API para no duplicarlas.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api:8000/fhir-gateway/Observation;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
